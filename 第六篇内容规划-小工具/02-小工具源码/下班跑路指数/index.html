<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>下班跑路指数</title>
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <!-- ==================== 封面 ==================== -->
  <section id="view-cover" class="view active">
    <div class="cover-hero">
      <div class="cover-kicker">下班跑路指数</div>
      <h1 class="cover-title">下班跑路<br>指数</h1>
      <p class="cover-slogan">12 道下班情景题，测测你是下班跑路选手，还是工位黏住人。</p>
    </div>

    <div class="cover-actions">
      <button type="button" class="btn-primary" id="btn-start">立即测试</button>
      <p class="privacy">纯本地计算，不采集、不上传</p>
    </div>

    <div class="card cover-main">
      <div class="cover-stats" aria-label="测试信息">
        <span><strong>10</strong> 种结果</span>
        <span><strong>12</strong> 道题</span>
        <span><strong>0</strong> 数据上传</span>
      </div>
      <div class="badge-preview" id="badge-preview"></div>

      <p class="cover-intro">凭第一反应选，测完拿类型代码、下班称号和结果卡。</p>

      <div class="cover-last" id="cover-last"></div>
    </div>
  </section>

  <!-- ==================== 答题 ==================== -->
  <section id="view-quiz" class="view">
    <div class="quiz-app-title">下班跑路指数</div>

    <div class="quiz-top">
      <div class="quiz-progress-row">
        <span class="quiz-progress-text" id="quiz-progress">第 1 / 12 题</span>
        <span class="quiz-progress-count">点选即下一题</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="quiz-fill"></div>
      </div>
    </div>

    <div class="quiz-question" id="quiz-question"></div>

    <div class="quiz-options" id="quiz-options"></div>

    <div class="quiz-nav">
      <button type="button" class="btn-ghost" id="btn-prev">← 上一题</button>
    </div>
  </section>

  <!-- ==================== 结果 ==================== -->
  <section id="view-result" class="view">
    <div class="result-head">
      <h2>你的跑路指数出炉了</h2>
      <div class="result-sub">保存结果卡，发同事群对答案</div>
    </div>

    <div class="result-canvas-wrap">
      <canvas id="result-canvas"></canvas>
    </div>

    <div class="result-meta">
      <div class="result-last" id="result-last"></div>
      <div class="result-compare" id="result-compare"></div>
      <div class="result-compare-detail" id="result-compare-detail"></div>
    </div>

    <div class="result-actions">
      <button type="button" class="btn-primary" id="btn-screenshot">保存到相册</button>
      <div class="save-status" id="save-status" role="status" aria-live="polite"></div>
      <div class="result-secondary-actions">
        <button type="button" class="btn-restart" id="btn-restart">我不服</button>
        <button type="button" class="btn-home" id="btn-home">回到首页</button>
      </div>
      <p class="privacy">仅保存这张结果卡，不读取你的相册内容</p>
    </div>
  </section>

  <!-- 脚本按固定顺序外链引入（无内联 script、无行内事件） -->
  <script src="./js/config.js"></script>
  <script src="./js/questions.js"></script>
  <script src="./js/results.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/score.js"></script>
  <script src="./js/canvas.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
